name: test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python scripts/check_boundaries.py
      - run: python scripts/check_js.py
      - run: python scripts/verify_examples.py
      - run: python scripts/build_release.py
      - name: Verify extracted source distribution
        run: python scripts/verify_release.py
